<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta name="description" content="龙裔王座：一款中世纪龙族主题的原创卡牌对战游戏。20 点总部生命、支援阵线与前线、39 张卡牌、装备与战术，挑战电脑对手。">
  <title>龙裔王座 · Dragonblood Throne</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070910'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23c9a24a' stroke-opacity='.5'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23e8c377' font-family='serif'%3E%E9%BE%99%3C/text%3E%3C/svg%3E">
  <style>
:root {
  --bg: #070910;
  --bg-soft: #0c1019;
  --panel: #111724;
  --panel-2: #0b0f17;
  --panel-3: #171e2c;
  --gold: #c9a24a;
  --gold-bright: #f0d28a;
  --gold-dim: #8a6c2e;
  --gold-line: rgba(201, 162, 74, 0.24);
  --parchment: #ece0c6;
  --text: #ded4bf;
  --muted: #958d7d;
  --blood: #a93832;
  --blood-bright: #e0604b;
  --teal: #3f8f86;
  --blue: #6ca8ff;
  --green: #7cc79b;
  --violet: #b18ae0;
  --unit-w: 97px;
  --unit-h: 112px;
  --hand-w: 118px;
  --hand-h: 180px;
  --row-gap: 10px;
  --serif: "Georgia", "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
  --brush: "KaiTi", "STKaiti", "Kaiti SC", "FangSong", "STFangsong", "SimSun", serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--serif);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
button { font-family: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
button:focus-visible { outline: 1px solid var(--gold-bright); outline-offset: 3px; }
::selection { background: rgba(201,162,74,.3); }

.app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

.app::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(1200px 600px at 18% -10%, rgba(120, 48, 26, 0.16), transparent 60%),
    radial-gradient(1000px 700px at 92% 108%, rgba(24, 62, 84, 0.16), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 7px);
}
.app::after {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 70;
  background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.42) 100%);
}

.screen { position: absolute; inset: 0; display: none; z-index: 2; }
.screen.active { display: flex; }

.icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border: 1px solid rgba(201,162,74,.16); border-radius: 999px;
  background: rgba(255,255,255,.025); font-size: 11px; color: #b7ad99;
  letter-spacing: .04em; white-space: nowrap;
}
.chip b { color: var(--parchment); font-weight: 600; }
.chip em { font-style: normal; color: #7c7566; font-size: 10px; }
.chip-ico { width: 10px; height: 10px; display: inline-block; border-radius: 2px; }
.hand-ico { background: linear-gradient(135deg, #b98a45, #6d4a20); }
.deck-ico { background: linear-gradient(135deg, #5f82b0, #2a3a55); }
.crystal-ico { background: linear-gradient(135deg, #8fd6ff, #2f6f9e); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); border-radius: 0; }

.text-btn {
  color: var(--muted); font-size: 13px; letter-spacing: .08em; padding: 6px 10px;
  border-radius: 6px; transition: color .2s, background .2s;
}
.text-btn:hover { color: var(--gold-bright); background: rgba(201,162,74,.08); }

.small-btn {
  font-size: 12px; letter-spacing: .06em; color: var(--text);
  border: 1px solid rgba(201,162,74,.28); border-radius: 6px;
  padding: 8px 14px; background: rgba(201,162,74,.05);
  transition: all .18s;
}
.small-btn:hover { border-color: var(--gold); background: rgba(201,162,74,.13); color: var(--gold-bright); }
.small-btn.primary {
  background: linear-gradient(180deg, rgba(201,162,74,.9), rgba(138,108,46,.9));
  color: #17120a; font-weight: bold; border-color: #e7c276;
}
.small-btn.primary:hover { filter: brightness(1.08); color: #0d0a05; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 8px; border: 1px solid rgba(201,162,74,.2);
  background: rgba(255,255,255,.025); color: #b9ad94; display: inline-flex;
  align-items: center; justify-content: center; transition: all .18s;
}
.icon-btn:hover { border-color: var(--gold); color: var(--gold-bright); background: rgba(201,162,74,.1); }
.icon-btn.danger:hover { border-color: var(--blood-bright); color: #ffb0a0; background: rgba(169,56,50,.14); }
.ib-glyph { font-size: 17px; line-height: 1; }

.title-screen {
  align-items: center; justify-content: center;
  background:
    radial-gradient(900px 620px at 72% 46%, rgba(96, 42, 24, 0.18), transparent 64%),
    radial-gradient(700px 500px at 20% 82%, rgba(24, 52, 66, 0.2), transparent 60%),
    linear-gradient(160deg, #0a0d15 0%, #070910 52%, #05070c 100%);
  overflow: hidden;
}
.title-screen .bg-veil {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, rgba(201,162,74,.05) 0 1px, transparent 1px 160px),
    repeating-linear-gradient(0deg, rgba(201,162,74,.03) 0 1px, transparent 1px 160px);
  mask-image: radial-gradient(circle at 50% 50%, black, transparent 78%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, black, transparent 78%);
  opacity: .7;
}
.embers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.embers span {
  position: absolute; bottom: -12px; width: 3px; height: 3px; border-radius: 50%;
  background: #f0b774; opacity: 0; filter: blur(.4px);
  box-shadow: 0 0 6px 1px rgba(240, 183, 116, .55);
  animation: emberRise linear infinite;
}
@keyframes emberRise {
  0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0; }
  8% { opacity: .85; }
  70% { opacity: .45; }
  100% { transform: translate3d(50px, -104vh, 0) scale(.2); opacity: 0; }
}

.title-inner {
  position: relative; z-index: 3; display: flex; align-items: center; justify-content: center;
  gap: clamp(24px, 5vw, 90px); width: min(1440px, 94vw);
}
.title-panel { max-width: 570px; flex: 1 1 520px; }
.eyebrow {
  display: flex; align-items: center; gap: 12px; margin: 0 0 16px;
  font-size: 10px; letter-spacing: .42em; color: #9c8c68; text-transform: uppercase;
}
.eyebrow i { width: 34px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim)); }
.eyebrow i:last-child { background: linear-gradient(90deg, var(--gold-dim), transparent); }

.game-title { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.title-cn {
  font-family: var(--brush); font-size: clamp(64px, 7.4vw, 108px); line-height: .98;
  letter-spacing: .06em; font-weight: bold;
  background: linear-gradient(180deg, #fdf2d4 0%, #e8c377 38%, #b3832f 72%, #6f4b16 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 18px rgba(201, 162, 74, .22));
}
.title-cn .gold { color: transparent; }
.title-en {
  font-size: clamp(11px, 1vw, 14px); letter-spacing: .55em; color: #b4955a; font-weight: normal;
}
.tagline {
  margin: 22px 0 30px; font-size: 15px; line-height: 1.9; color: #a89d88; letter-spacing: .06em;
  padding-left: 18px; border-left: 1px solid rgba(201,162,74,.3);
}

.title-menu { display: flex; flex-direction: column; gap: 10px; width: min(400px, 100%); }
.menu-btn {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px; border: 1px solid rgba(201,162,74,.26); border-radius: 4px;
  background: linear-gradient(90deg, rgba(22, 28, 41, .88), rgba(13, 17, 26, .6));
  color: #d9cdb4; text-align: left; overflow: hidden; transition: all .22s;
}
.menu-btn::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--gold); opacity: .55; transition: all .22s;
}
.menu-btn::after {
  content: "\25C6"; position: absolute; right: 16px; font-size: 8px; color: var(--gold);
  opacity: 0; transform: translateX(-6px); transition: all .22s;
}
.menu-btn:hover { border-color: rgba(201,162,74,.7); background: linear-gradient(90deg, rgba(46, 38, 24, .9), rgba(16, 20, 30, .7)); transform: translateX(3px); }
.menu-btn:hover::before { width: 4px; opacity: 1; }
.menu-btn:hover::after { opacity: 1; transform: translateX(0); }
.menu-btn.primary {
  border-color: rgba(232, 195, 119, .55);
  background: linear-gradient(90deg, rgba(201,162,74,.22), rgba(30, 26, 18, .75));
}
.menu-btn.primary .mb-cn { color: #f4e3bb; }
.menu-btn.ghost { opacity: .78; }
.mb-cn { font-family: var(--brush); font-size: 20px; letter-spacing: .16em; }
.mb-en { font-size: 9px; letter-spacing: .25em; color: #857a63; }

.title-footer {
  margin-top: 30px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  font-size: 11px; color: #776f5f; letter-spacing: .06em;
}
.tf-link { color: #a89263; font-size: 11px; letter-spacing: .06em; border-bottom: 1px dotted rgba(201,162,74,.3); }
.tf-link:hover { color: var(--gold-bright); }

.title-art {
  position: relative; flex: 0 0 auto; width: clamp(300px, 33vw, 500px); aspect-ratio: 1 / .98;
  display: flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 20px 60px rgba(160, 90, 30, .22));
  animation: floatSlow 7s ease-in-out infinite;
}
.title-art svg { width: 100%; height: 100%; }
@keyframes floatSlow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

.title-corner { position: absolute; width: 70px; height: 70px; border-color: rgba(201,162,74,.28); border-style: solid; z-index: 2; pointer-events: none; }
.title-corner.tl { top: 24px; left: 24px; border-width: 1px 0 0 1px; }
.title-corner.tr { top: 24px; right: 24px; border-width: 1px 1px 0 0; }
.title-corner.bl { bottom: 24px; left: 24px; border-width: 0 0 1px 1px; }
.title-corner.br { bottom: 24px; right: 24px; border-width: 0 1px 1px 0; }

.battle-screen {
  background:
    radial-gradient(900px 500px at 50% 0%, rgba(104, 42, 28, .14), transparent 65%),
    radial-gradient(900px 600px at 50% 100%, rgba(24, 55, 68, .14), transparent 65%),
    linear-gradient(180deg, #080b12, #070910 45%, #06080e);
}
.battle-shell {
  position: relative; display: flex; flex-direction: column; width: 100%; height: 100%;
  padding: 10px clamp(10px, 1.4vw, 22px) 10px; gap: 8px;
}

.hq-bar {
  position: relative; display: flex; align-items: center; gap: 14px;
  padding: 7px 14px; min-height: 76px;
  background: linear-gradient(180deg, rgba(20, 26, 39, .92), rgba(10, 14, 21, .92));
  border: 1px solid rgba(201,162,74,.18); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.03);
  transition: box-shadow .25s;
}
.enemy-bar { border-top: 1px solid rgba(200, 84, 62, .3); }
.hq-bar.targetable {
  box-shadow: 0 0 0 2px rgba(240, 170, 110, .75), 0 0 40px rgba(224, 96, 75, .3);
  animation: targetPulse 1.2s ease-in-out infinite;
}
@keyframes targetPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }

.hq-emblem { width: 62px; height: 62px; flex: 0 0 62px; }
.hq-emblem.small { width: 56px; height: 56px; flex-basis: 56px; }
.hq-emblem svg { width: 100%; height: 100%; }
.hq-main { flex: 1; max-width: 540px; min-width: 0; }
.hq-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.hq-name { font-family: var(--brush); font-size: 19px; letter-spacing: .12em; color: #eadbb9; }
.hq-deck-name { font-size: 10px; letter-spacing: .18em; color: #8d8061; }
.hp-track {
  position: relative; height: 19px; border-radius: 4px; overflow: hidden;
  background: #160d0d; border: 1px solid rgba(255,255,255,.08);
  box-shadow: inset 0 2px 6px rgba(0,0,0,.6);
}
.hp-fill { position: absolute; inset: 0; width: 100%; transition: width .45s cubic-bezier(.2,.8,.3,1); border-radius: 3px; }
.hp-fill.enemy { background: linear-gradient(90deg, #6e241f, #c0493a 55%, #e0735a); box-shadow: 0 0 14px rgba(200,80,60,.4); }
.hp-fill.player { background: linear-gradient(90deg, #2c5c4d, #57977e 55%, #8cc9a9); box-shadow: 0 0 14px rgba(90,180,140,.28); }
.hp-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  gap: 2px; font-size: 11px; letter-spacing: .1em; color: #f6ecd7;
  text-shadow: 0 1px 3px rgba(0,0,0,.85);
}
.hp-text b { font-size: 13px; }
.hq-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.battle-tools { display: flex; gap: 6px; margin-left: 2px; }

.battle-body { position: relative; flex: 1; display: flex; gap: 12px; min-height: 0; }
.board {
  flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 7px;
  min-width: 0; padding: 0 2px;
}
.board-line {
  position: relative; display: flex; align-items: center;
  min-height: calc(var(--unit-h) + 14px);
  padding: 6px 12px 6px 44px;
  border: 1px solid rgba(201,162,74,.1); border-radius: 10px;
  background: linear-gradient(180deg, rgba(20, 26, 38, .38), rgba(9, 12, 18, .55));
  transition: border-color .2s, background .2s, box-shadow .2s;
}
.board-line.enemy-side { border-top-color: rgba(200, 84, 62, .14); }
.board-line.player-side { border-bottom-color: rgba(84, 150, 130, .16); }
.board-line.deploy-zone {
  border-color: rgba(240, 200, 120, .55);
  background: linear-gradient(180deg, rgba(84, 66, 30, .28), rgba(20, 18, 12, .4));
  box-shadow: inset 0 0 30px rgba(201,162,74,.12), 0 0 22px rgba(201,162,74,.08);
}
.line-tag {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  writing-mode: vertical-rl; font-size: 10px; letter-spacing: .42em;
  color: rgba(201,162,74,.5); font-family: var(--brush);
  padding: 6px 0; border-left: 1px solid rgba(201,162,74,.14);
  padding-left: 7px;
}
.row {
  display: grid; grid-template-columns: repeat(5, var(--unit-w));
  justify-content: center; gap: var(--row-gap); width: 100%; min-height: var(--unit-h);
}
.board-slot {
  width: var(--unit-w); height: var(--unit-h); border-radius: 8px;
  border: 1px dashed rgba(201,162,74,.1);
  display: flex; align-items: center; justify-content: center;
  position: relative; transition: all .2s;
}
.board-slot.filled { border-color: transparent; }
.board-line.deploy-zone .board-slot:not(.filled) {
  border-color: rgba(240, 200, 120, .4);
  background: rgba(201,162,74,.06);
  animation: slotPulse 1.6s ease-in-out infinite;
}
@keyframes slotPulse { 0%,100% { box-shadow: inset 0 0 0 rgba(201,162,74,0); } 50% { box-shadow: inset 0 0 18px rgba(201,162,74,.18); } }
.frontline-divider {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  height: 15px; font-size: 9px; letter-spacing: .72em; color: rgba(201,162,74,.55);
  font-family: var(--brush);
}
.frontline-divider i { height: 1px; width: min(280px, 26%); background: linear-gradient(90deg, transparent, rgba(201,162,74,.35), transparent); }

.unit {
  position: relative; width: var(--unit-w); height: var(--unit-h);
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid rgba(201,162,74,.4); border-radius: 8px;
  background: linear-gradient(165deg, #1a2130, #0c1018 70%);
  box-shadow: 0 5px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  cursor: pointer; transition: transform .18s, box-shadow .18s, filter .18s;
  color: inherit; text-align: left;
}
.unit::after {
  content: ""; position: absolute; inset: 0; border-radius: 7px; pointer-events: none;
  box-shadow: inset 0 0 18px rgba(0,0,0,.35);
}
.unit:hover { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(0,0,0,.55); z-index: 4; }
.unit.exhausted { filter: saturate(.55) brightness(.76); }
.unit.frozen { filter: saturate(.6) brightness(.9) hue-rotate(-14deg); }
.unit.selectable { border-color: rgba(240, 205, 130, .9); box-shadow: 0 0 0 1px rgba(240,205,130,.5), 0 0 22px rgba(201,162,74,.35); }
.unit.valid-target {
  border-color: #ffcf7d;
  box-shadow: 0 0 0 2px rgba(255, 190, 100, .75), 0 0 28px rgba(255, 160, 80, .45);
  animation: validPulse 1.1s ease-in-out infinite;
  z-index: 5;
}
@keyframes validPulse { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.03); } }
.unit-art { height: 58%; background: #05070c; position: relative; overflow: hidden; }
.unit-art svg { width: 100%; height: 100%; display: block; }
.unit-name {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 10px; line-height: 1.1; letter-spacing: .02em; color: #e6d8ba;
  padding: 2px 3px; background: rgba(8, 11, 17, .72); border-top: 1px solid rgba(201,162,74,.12);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.unit-stats {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1px 5px 3px; background: rgba(8, 11, 17, .92);
  font-family: var(--serif); font-weight: bold; font-size: 13px;
}
.unit-stats .u-atk { color: #ffd09a; }
.unit-stats .u-def { color: #a9d6ff; }
.unit-stats .u-atk.buffed { color: #ffb067; text-shadow: 0 0 8px rgba(255,140,60,.55); }
.unit-stats .u-def.buffed { color: #8fe1ff; text-shadow: 0 0 8px rgba(90,200,255,.55); }
.unit-status { position: absolute; top: 3px; right: 3px; display: flex; gap: 2px; z-index: 3; }
.status-ico {
  width: 15px; height: 15px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: rgba(8, 12, 18, .85); border: 1px solid rgba(255,255,255,.15);
  font-size: 9px; color: #cfe6ff; line-height: 1;
}
.status-ico.snow { color: #a9e8ff; border-color: rgba(120, 210, 255, .5); }
.status-ico.burn { color: #ff9a5a; border-color: rgba(255, 130, 70, .5); }
.status-ico.shield { color: #ffd88a; border-color: rgba(255, 200, 100, .5); }
.status-ico.smoke { color: #b6b0c9; }
.status-ico.robe { color: #c9a6ff; }
.status-ico.azure { color: #6fe8d6; border-color: rgba(100, 230, 210, .5); }
.unit-ready-dot {
  position: absolute; left: 50%; bottom: -3px; transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: #f5d48c;
  box-shadow: 0 0 8px rgba(245, 212, 140, .9);
}
.unit-equip-pips { position: absolute; bottom: 20px; left: 4px; display: flex; gap: 2px; z-index: 3; }
.equip-pip { width: 7px; height: 7px; transform: rotate(45deg); background: #d8b36a; box-shadow: 0 0 6px rgba(216,179,106,.6); }
.unit-protected::before {
  content: ""; position: absolute; inset: 0; border-radius: 7px;
  border: 1px solid rgba(255, 210, 110, .55); pointer-events: none; z-index: 2;
}

.log-panel {
  width: 272px; flex: 0 0 272px; display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(17, 23, 36, .92), rgba(8, 11, 17, .95));
  border: 1px solid rgba(201,162,74,.16); border-radius: 10px; overflow: hidden;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}
.log-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; font-family: var(--brush); font-size: 14px; letter-spacing: .4em;
  color: var(--gold); border-bottom: 1px solid rgba(201,162,74,.14);
  background: rgba(201,162,74,.04);
}
.log-close { color: #8d8168; font-size: 18px; line-height: 1; padding: 0 4px; }
.log-close:hover { color: var(--gold-bright); }
.log-list { flex: 1; overflow-y: auto; padding: 8px 10px; font-size: 11.5px; line-height: 1.5; scrollbar-width: thin; }
.log-entry { padding: 2px 0 2px 8px; border-left: 2px solid transparent; color: #a9a08e; }
.log-entry.turn-self { color: #efcf8b; border-color: rgba(201,162,74,.6); margin-top: 5px; letter-spacing: .06em; }
.log-entry.turn-enemy { color: #d9927e; border-color: rgba(200, 84, 62, .5); margin-top: 5px; letter-spacing: .06em; }

.dc-emblem { width: 52px; height: 52px; flex: 0 0 52px; display: flex; align-items: center; justify-content: center; font-family: var(--brush); font-size: 30px; color: var(--dc-accent, var(--gold)); border: 1px solid currentColor; border-radius: 50%; opacity: .9; }

.rules-content { font-size: 12.5px; line-height: 1.75; color: #b7ad9a; }

.result-panel { width: min(560px, 92vw); text-align: center; padding: 38px 34px 30px; }

.result-title.lose { color: #cf9484; text-shadow: 0 0 50px rgba(180, 70, 55, .25); }
.result-reason { margin: 8px 0 22px; font-size: 12px; color: #9b9080; letter-spacing: .08em; }
.result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 24px; }
.rs-item { padding: 10px 6px; border: 1px solid rgba(201,162,74,.16); border-radius: 8px; background: rgba(255,255,255,.02); }
.rs-item b { display: block; font-size: 22px; color: #ecd9ad; font-weight: normal; }
.rs-item span { display: block; font-size: 9.5px; color: #817868; letter-spacing: .12em; margin-top: 3px; }
.result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.result-record { margin-top: 16px; font-size: 10px; color: #7b7362; letter-spacing: .08em; }

.toast-root { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(90vw, 640px); }
.toast {
  padding: 9px 20px; border-radius: 999px; font-size: 12px; letter-spacing: .06em;

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,.025); }
::-webkit-scrollbar-thumb { background: rgba(201,162,74,.22); border-radius: 4px; }

  .hand .card .card-art { height: 52px; }
  .hand .card .card-text { display: none; }

  .turn-indicator span { font-size: 14px; }
  .hint-bar { bottom: 150px; }
}

.impact {
  position: fixed; width: 74px; height: 74px; border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none;
  border: 2px solid rgba(255, 196, 120, .85);
  background: radial-gradient(circle, rgba(255, 220, 160, .45), rgba(255, 140, 60, .12) 55%, transparent 72%);
  box-shadow: 0 0 26px rgba(255, 150, 70, .55);
  animation: impactPop .45s cubic-bezier(.2, .7, .3, 1) forwards;
}
@keyframes impactPop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
  35% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }

.menu-caption { max-width: 250px; white-space: normal; line-height: 1.45; }
.deck-select-panel { width: min(660px, 92vw); }
.rules-panel { width: min(780px, 94vw); }
.codex-panel { width: min(1180px, 94vw); }
.deck-choice .dc-emblem { font-weight: normal; }
.hq-deck-name { color: #81755d; }
.player-bar .hq-name { font-size: 16px; }
.player-bar .chip { font-size: 10px; }
.side-panel-note { font-size: 10px; color: #7b7362; }

.card-sub { display: none; }
.card-name { font-size: 15.5px; }
.card-text { font-size: 10px; line-height: 1.45; }

.codex-grid .card .card-art { height: 84px; }
.deck-pool .card { min-height: 216px; }
.deck-pool .card .card-art { height: 76px; }
.hand .card .card-name { font-size: 14px; }

.hand .card .card-art { height: 72px; }

.title-art { width: clamp(320px, 37vw, 560px); aspect-ratio: 260 / 175; }
.title-art svg { width: 100%; height: 100%; }
@media (max-height: 900px) {
  .hand .card .card-art { height: 58px; }
}
@media (max-height: 760px) {
  .hand .card .card-art { height: 52px; }
}

.card-preview {
  position: fixed; z-index: 78; width: 240px; opacity: 0; pointer-events: none;
  transform: translateY(10px); transition: opacity .16s ease, transform .16s ease;
  filter: drop-shadow(0 26px 55px rgba(0, 0, 0, .72));
}
.card-preview.open { opacity: 1; transform: none; }

.card-preview .card-type { font-size: 10px; }
.card-preview .card-text { font-size: 12px; line-height: 1.6; max-height: none; }
.card-preview .card-stats-row { padding-top: 6px; }
.card-preview .card-stat { font-size: 19px; }
.card-preview .kw { font-size: 9.5px; padding: 2px 6px; }
.card-preview .cost-gem { width: 32px; height: 36px; font-size: 17px; }
.hand .card { min-height: 0; }
.hand { overflow: visible; }

/* 手牌宽度与重叠由 ui.js 的 layoutHand() 按可用宽度动态计算，避免覆盖结束回合按钮 */
.hand { --hand-overlap: 32px; overflow: visible; }
.hand .card { min-height: 0; }
.hand .card + .card { margin-left: calc(-1 * var(--hand-overlap, 32px)); }

@media (max-width: 900px) {
  .title-inner { flex-direction: column; gap: 10px; }
  .title-art { width: min(62vw, 300px); order: -1; }
  .title-panel { text-align: center; }
  .eyebrow { justify-content: center; }
  .tagline { border-left: none; padding-left: 0; }
  .title-menu { margin: 0 auto; }
  .title-footer { justify-content: center; }
  .battle-shell { padding: 6px; }
  .player-hq { flex: 0 0 126px; max-width: 126px; gap: 6px; }
  .player-hq .hq-emblem { display: none; }
  .player-hq .hq-name { font-size: 12px; }
  .player-hq .hq-deck-name, .player-meta { display: none; }
  .player-hq .hp-track { height: 15px; }
  .player-hq .hp-text { font-size: 9px; }
  .crystal-zone { flex-basis: 76px; }
  .end-zone { flex-basis: 112px; }
  .hq-chips { display: none; }
  .deck-body { flex-direction: column; }
  .deck-side { width: auto; flex-basis: auto; max-height: 38vh; }
  .deck-header { flex-wrap: wrap; }
}
.hint-skip {
  pointer-events: auto; cursor: pointer; margin-left: 12px; padding: 3px 10px;
  border-radius: 999px; border: 1px solid rgba(201,162,74,.55);
  background: rgba(201,162,74,.14); color: #f0d79a; font-size: 11px;
  font-family: inherit; letter-spacing: .06em;
}
.hint-skip:hover { background: rgba(201,162,74,.28); color: #fff1cb; }
.fx-dust {
  position: fixed; pointer-events: none; z-index: 76; border-radius: 50%;
  transform: translate(-50%, -50%); filter: blur(.4px);
  box-shadow: 0 0 8px rgba(255, 220, 170, .25);
}
.fx-ring {
  position: fixed; pointer-events: none; z-index: 76; width: 46px; height: 46px;
  border-radius: 50%; border: 2px solid rgba(255, 210, 140, .65);
  transform: translate(-50%, -50%);
}
.fx-slash {
  position: fixed; pointer-events: none; z-index: 77; width: 92px; height: 92px;
  border-radius: 50%; border: 3px solid transparent;
  border-top-color: rgba(255, 235, 190, .95);
  border-right-color: rgba(255, 180, 100, .75);
  filter: drop-shadow(0 0 10px rgba(255, 170, 90, .55));
}
.unit.windup {
  z-index: 9;
  box-shadow: 0 0 0 1px rgba(255, 220, 150, .7), 0 0 26px rgba(255, 170, 80, .5);
}
.unit.windup::after { content: ""; }
.surrender-btn {
  margin-top: 2px; padding: 6px 10px; border-radius: 6px;
  border: 1px solid rgba(190, 90, 70, .4);
  background: rgba(169, 56, 50, .12);
  color: #d99b8c; font-size: 11px; letter-spacing: .16em;
  font-family: var(--brush); transition: all .18s;
}
.surrender-btn:hover {
  border-color: rgba(230, 110, 85, .8);
  background: rgba(169, 56, 50, .24);
  color: #ffd0c5;
  box-shadow: 0 0 16px rgba(200, 80, 60, .18);
}
.surrender-btn:active { transform: translateY(1px); }
</style>

<body>
  <div id="app" class="app">

    <!-- ======================= 主菜单 ======================= -->
    <section id="screen-title" class="screen title-screen active">
      <div class="bg-veil"></div>
      <div class="embers" id="title-embers"></div>
      <div class="title-inner">
        <div class="title-panel">
          <p class="eyebrow"><i></i>A MEDIEVAL DRAGON CARD GAME<i></i></p>
          <h1 class="game-title">
            <span class="title-cn">龙裔<span class="gold">王座</span></span>
            <span class="title-en">DRAGONBLOOD THRONE</span>
          </h1>
          <p class="tagline">龙晶燃起，前线列阵。<br>以血脉与王座之名，击破敌方总部。</p>
          <div class="title-menu">
            <button class="menu-btn primary" id="btn-play">
              <span class="mb-cn">开始对战</span><span class="mb-en">PLAY</span>
            </button>
            <button class="menu-btn" id="btn-deckbuild">
              <span class="mb-cn">卡组构筑</span><span class="mb-en">DECK BUILDER</span>
            </button>
            <button class="menu-btn" id="btn-codex">
              <span class="mb-cn">卡牌图鉴</span><span class="mb-en">CARD CODEX</span>
            </button>
            <button class="menu-btn ghost" id="btn-rules">
              <span class="mb-cn">规则说明</span><span class="mb-en">HOW TO PLAY</span>
            </button>
          </div>
          <div class="title-footer">
            <span class="tf-item">v1.0 · 原创单机卡牌对战</span>
            <button class="tf-link" id="btn-sound">音效：开</button>
            <span class="tf-item" id="title-record">战绩 0 胜 · 0 负</span>
          </div>
        </div>
        <div class="title-art" id="title-art"></div>
      </div>
      <div class="title-corner tl"></div>
      <div class="title-corner tr"></div>
      <div class="title-corner bl"></div>
      <div class="title-corner br"></div>
    </section>

    <!-- ======================= 对战 ======================= -->
    <section id="screen-battle" class="screen battle-screen">
      <div class="battle-shell">
        <header class="hq-bar enemy-bar" id="enemy-hq-wrap">
          <div class="hq-emblem" id="enemy-emblem"></div>
          <div class="hq-main">
            <div class="hq-title">
              <span class="hq-name" id="enemy-name">对手</span>
              <span class="hq-deck-name" id="enemy-deck-name"></span>
            </div>
            <div class="hp-track" id="enemy-hp-track">
              <div class="hp-fill enemy" id="enemy-hp-fill"></div>
              <div class="hp-text"><b id="enemy-hp">20</b><span> / 20</span></div>
            </div>
          </div>
          <div class="hq-chips">
            <span class="chip" title="手牌"><i class="chip-ico hand-ico"></i><b id="enemy-hand">4</b></span>
            <span class="chip" title="卡组"><i class="chip-ico deck-ico"></i><b id="enemy-deck">25</b></span>
            <span class="chip" title="龙晶"><i class="chip-ico crystal-ico"></i><b id="enemy-crystals">1</b><em>/10</em></span>
          </div>
          <div class="battle-tools">
            <button class="icon-btn" id="btn-log-toggle" title="打开/收起战报">
              <span class="ib-glyph">≡</span>
            </button>
            <button class="icon-btn" id="btn-battle-rules" title="规则说明">
              <span class="ib-glyph">?</span>
            </button>
            <button class="icon-btn danger" id="btn-concede" title="投降">
              <span class="ib-glyph">旗</span>
            </button>
          </div>
        </header>

        <div class="battle-body">
          <div class="board" id="board">
            <div class="board-line enemy-side support-line" data-side="1" data-line="support">
              <div class="line-tag"><span>支援阵线</span></div>
              <div class="row" id="row-enemy-support"></div>
            </div>
            <div class="board-line enemy-side front-line" data-side="1" data-line="front">
              <div class="line-tag"><span>前线</span></div>
              <div class="row" id="row-enemy-front"></div>
            </div>
            <div class="frontline-divider">
              <i></i><span>前 线</span><i></i>
            </div>
            <div class="board-line player-side front-line" data-side="0" data-line="front">
              <div class="line-tag"><span>前线</span></div>
              <div class="row" id="row-player-front"></div>
            </div>
            <div class="board-line player-side support-line" data-side="0" data-line="support">
              <div class="line-tag"><span>支援阵线</span></div>
              <div class="row" id="row-player-support"></div>
            </div>
          </div>

          <aside class="log-panel" id="log-panel">
            <div class="log-head">
              <span>战 报</span>
              <button class="log-close" id="btn-log-close" title="收起">×</button>
            </div>
            <div class="log-list" id="log-list"></div>
          </aside>
        </div>

        <footer class="player-bar">
          <div class="player-hq" id="player-hq-wrap">
            <div class="hq-emblem small" id="player-emblem"></div>
            <div class="hq-main">
              <div class="hq-title">
                <span class="hq-name">你的总部</span>
                <span class="hq-deck-name" id="player-deck-name"></span>
              </div>
              <div class="hp-track">
                <div class="hp-fill player" id="player-hp-fill"></div>
                <div class="hp-text"><b id="player-hp">20</b><span> / 20</span></div>
              </div>
              <div class="player-meta">
                <span class="chip" title="卡组"><i class="chip-ico deck-ico"></i><b id="player-deck">25</b></span>
                <span class="chip" title="手牌"><i class="chip-ico hand-ico"></i><b id="player-hand">5</b><em>/10</em></span>
              </div>
            </div>
          </div>

          <div class="crystal-zone" id="crystal-zone">
            <div class="crystal-num"><b id="crystal-cur">1</b><span>/</span><em id="crystal-max">1</em></div>
            <div class="crystal-dots" id="crystal-dots"></div>
            <div class="crystal-label">龙晶</div>
          </div>

          <div class="hand-zone">
            <div class="hand" id="hand"></div>
            <div class="hand-hint" id="hand-hint">点击手牌以打出 · Esc 取消选择</div>
          </div>

          <div class="end-zone">
            <div class="turn-indicator" id="turn-indicator">
              <b id="turn-number">第 1 回合</b>
              <span id="turn-owner">你的回合</span>
            </div>
            <button class="end-btn" id="btn-end-turn">
              <span>结束回合</span><em>END TURN</em>
            </button>
            <button class="surrender-btn" id="btn-concede-bottom" title="认输并结束本局">投降</button>
          </div>
        </footer>

        <div class="hint-bar" id="hint-bar"></div>
        <div class="card-preview" id="card-preview"></div>
        <div class="unit-menu" id="unit-menu"></div>
        <div class="fx-layer" id="fx-layer"></div>
        <div class="turn-flash" id="turn-flash"></div>
      </div>
    </section>

    <!-- ======================= 卡组构筑 ======================= -->
    <section id="screen-deckbuild" class="screen deck-screen">
      <header class="deck-header">
        <button class="text-btn" id="btn-deck-back">← 返回主菜单</button>
        <div class="deck-heading">
          <h2>卡组构筑</h2>
          <p>从全卡池中挑选 30 张卡牌 · 同名最多 3 张 · 点击卡牌添加或移除</p>
        </div>
        <div class="deck-actions">
          <button class="small-btn" id="btn-deck-clear">清空</button>
          <button class="small-btn" id="btn-deck-presets">载入预设</button>
          <button class="small-btn" id="btn-deck-save">保存卡组</button>
          <button class="small-btn primary" id="btn-deck-fight">用此卡组对战</button>
        </div>
      </header>
      <div class="deck-body">
        <div class="deck-pool-wrap">
          <div class="filters" id="deck-filters"></div>
          <div class="deck-pool" id="deck-pool"></div>
        </div>
        <aside class="deck-side">
          <div class="deck-side-head">
            <div class="deck-count"><b id="deck-count">0</b><span>/30</span></div>
            <div class="deck-side-info" id="deck-side-info">点击左侧卡牌加入卡组</div>
          </div>
          <div class="deck-curve" id="deck-curve"></div>
          <div class="deck-list" id="deck-list"></div>
          <div class="deck-msg" id="deck-msg"></div>
        </aside>
      </div>
    </section>

    <!-- 弹窗 / 提示 -->
    <div class="modal-root" id="modal-root" aria-live="polite"></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>
  </div>

  <script>
/* ==========================================================================
 * 龙裔王座 · Dragonblood Throne
 * cards.js — 卡牌数据、预设卡组与卡组校验（纯数据，可被 Node 直接加载测试）
 * ========================================================================== */
(function (root) {
  'use strict';

  /* 稀有度 */
  const RARITY = {
    common:    { name: '普通', color: '#b9b3a5' },
    rare:      { name: '精良', color: '#63a9ee' },
    epic:      { name: '史诗', color: '#c184f0' },
    legendary: { name: '传说', color: '#f0b64a' }
  };

  /* 定位说明：
   *   unit   单位卡：部署到支援阵线；攻击/移动每回合一次
   *   equip  装备卡：只能装备给拥有装备槽的混血种
   *   tactic 战术卡：立即结算，一次性

/* ==========================================================================

(function (root) {

  const RULES = {
    HQ_HP: 20,
    START_HAND: 4,
    HAND_LIMIT: 10,
    MAX_CRYSTALS: 10,
    ROW_LIMIT: 5,
    BURN_DAMAGE: 1,
    DECK_SIZE: 30

  const SIDE_NAMES = ['你', '对手'];

  /* ============================ 基础工具 ============================ */

  function otherSide(side) { return side === 0 ? 1 : 0; }

  function makeRng(seed) {

    }
    return arr;
  }

  function emit(state, ev) { state.events.push(ev); }

  function addLog(state, text, kind) {
    state.log.push({ turn: state.turn, text, kind: kind || 'info' });
    if (state.log.length > 220) state.log.shift();
    state.logSeq = (state.logSeq || 0) + 1;
  }

  function currentPlayer(state) { return state.players[state.active]; }

  function allUnits(state, side) {
    const p = state.players[side];
    return p.front.concat(p.support);
  }

  function findUnit(state, side, uid) {
    const p = state.players[side];
    for (const row of [p.front, p.support]) {
      for (const u of row) if (u.uid === uid) return u;

    return null;
  }

  function findUnitAnywhere(state, uid) {
    return findUnit(state, 0, uid) || findUnit(state, 1, uid);
  }

  function rowOf(state, unit) {
    const p = state.players[unit.side];
    return unit.line === 'front' ? p.front : p.support;
  }

  function randomOf(state, arr) {
    if (!arr.length) return null;
    return arr[Math.floor(state.random() * arr.length)];
  }

  /* ============================ 单位属性 ============================ */

  function unitMaxDef(unit) {
    return Math.max(0, unit.baseDef + unit.bonusDef);
  }

  function unitAtk(state, unit) {
    let atk = unit.baseAtk + unit.bonusAtk;
    if (unit.cardId === 'two_legged_wyvern') {

  function hasRobe(unit) { return unit.equipment.indexOf('robe') >= 0; }

  function isUntargetable(unit) {

    return false;

  function isProtected(state, unit) {
    const row = rowOf(state, unit);
    const i = row.indexOf(unit);
    if (i < 0) return false;
    if (i > 0 && row[i - 1].cardId === 'cave_dragon') return true;
    if (i < row.length - 1 && row[i + 1].cardId === 'cave_dragon') return true;
    return false;

  function canBeAttacked(state, unit) {

  function canAttackWith(state, unit) {

  function healUnit(state, unit, amount) {

  function applyBurn(state, unit, sourceName) {
    if (!unit) return;

  }

  function damageHQ(state, side, amount, source) {
    if (state.winner != null || amount <= 0) return 0;
    const p = state.players[side];
    p.hp = Math.max(0, p.hp - amount);
    p.stats.damageTaken += amount;
    emit(state, { t: 'hqDamage', side, amount, hp: p.hp, source: source || null });
    addLog(state, `${p.name}的总部受到 ${amount} 点伤害（剩余 ${p.hp}）。`, side === 0 ? 'bad' : 'good');

  }

  function healHQ(state, side, amount) {

    const p = state.players[side];
    const before = p.hp;
    p.hp = Math.min(p.maxHp, p.hp + amount);
    const real = p.hp - before;
    if (real > 0) {
      emit(state, { t: 'hqHeal', side, amount: real, hp: p.hp });
      addLog(state, `${p.name}的总部恢复了 ${real} 点生命（当前 ${p.hp}）。`, side === 0 ? 'good' : 'bad');

  function checkWinner(state) {

    const row = rowOf(state, unit);
    const idx = row.indexOf(unit);
    if (idx < 0) return false;
    row.splice(idx, 1);

      hybrid: units.some(u => u.tribe === 'hybrid')

    if (p.crystals < card.cost) return { ok: false, reason: `龙晶不足（需要 ${card.cost}）` };

    }

      if (!targets.length) return { ok: false, reason: '没有合法目标' };
    }

    const id = p.hand[handIndex];
    if (id == null) return null;

    const play = canPlayCard(state, side, handIndex);

      index: handIndex,

      targets: play.ok && card.target ? validTargetList(state, side, card) : []

      name: card.name,
      en: card.en,
      tribe: card.tribe,
      cost: card.cost,
      art: card.art,
      accent: card.accent,
      rarity: card.rarity,

      baseDef: card.def || 0,

    if (!card || card.type !== 'unit' || card.cost < 3) return;
    for (let side = 0; side < 2; side++) {
      for (const u of allUnits(state, side)) {
        if (u.cardId === 'elf_dragon' && u !== deployedUnit) {
          buffUnit(state, u, 0, 1, '精灵龙');
          addLog(state, '「精灵龙」感知到高阶单位的部署，防御力+1。', 'buff');
        }
      }
    }
  }

  function applyDeployEffect(state, side, unit, target, card) {
    const enemy = otherSide(side);
    switch (card.id) {
      case 'basilisk':
        unit.smoke = true;
        addLog(state, '蛇怪潜入烟幕，未行动前无法被选中。', 'buff');
        break;
      case 'demon_dragon':
        addLog(state, '魔龙降临，深渊之火灼烧敌方总部。', 'trigger');
        damageHQ(state, enemy, 2, '魔龙');
        break;
      case 'welsh_red': {
        const allies = allUnits(state, side);
        for (const u of allies) buffUnit(state, u, 0, 2, '威尔士红龙');
        addLog(state, '威尔士红龙展开双翼，所有友方单位防御力 +2。', 'buff');
        break;
      }
      case 'ice_dragon':
        if (target) {
          const t = findUnit(state, target.side != null ? target.side : enemy, target.uid);
          if (t) {
            freezeUnit(state, t, '冰原龙');
            addLog(state, `冰原龙冻结了「${t.name}」。`, 'buff');
          }
        }
        break;
      case 'fairy_dragon': {
        const t = target
          ? findUnit(state, target.side != null ? target.side : side, target.uid)
          : unit;
        if (t) {
          t.bonusDef += 1;
          t.def = unitMaxDef(t);
          t.bonusAtk += 1;
          emit(state, { t: 'buff', side: t.side, uid: t.uid, atk: 1, def: 1, atkNow: unitAtk(state, t), defNow: unitMaxDef(t), reason: '仙灵龙' });
          addLog(state, `仙灵龙修复了「${t.name}」，其获得 +1/+1。`, 'buff');
        }
        break;
      }
      default:
        break;
    }
  }

  function applyEquip(state, side, unit, card) {
    unit.equipment.push(card.id);
    if (card.id === 'shield') {
      unit.bonusDef += 1; unit.def += 1;
    } else if (card.id === 'iron_sword') {
      unit.bonusAtk += 1;
    } else if (card.id === 'wooden_sword') {
      unit.pendingEquipBuffs.push({ atk: 1, source: '木剑' });
    } else if (card.id === 'leather_armor') {
      unit.pendingEquipBuffs.push({ def: 1, source: '皮甲' });
    }
    emit(state, {
      t: 'equip', side, uid: unit.uid, cardId: card.id,
      atkNow: unitAtk(state, unit), defNow: unitMaxDef(unit)
    });
    addLog(state, `「${unit.name}」装备了「${card.name}」。`, 'buff');
    if (card.id === 'wooden_sword' || card.id === 'leather_armor') {
      addLog(state, '装备效果将在你的下个回合开始时生效。', 'info');
    }
  }

  function resolveTactic(state, side, card, target) {
    const enemy = otherSide(side);
    const p = state.players[side];
    const enemyP = state.players[enemy];
    switch (card.id) {
      case 'dragon_decree': {
        const t = target && findUnit(state, side, target.uid);
        if (t) {
          buffUnit(state, t, 1, 1, '龙族诏令');
          addLog(state, `龙族诏令强化了「${t.name}」（+1/+1）。`, 'buff');
        }
        break;
      }
      case 'for_breeding': {
        const dragons = allUnits(state, side).filter(u => u.tribe === 'dragon');
        for (const u of dragons) buffUnit(state, u, 0, 2, '为了繁衍');
        addLog(state, `为了繁衍：${dragons.length} 个友方龙族单位防御力 +2。`, 'buff');
        break;
      }
      case 'cold_wind': {
        const targets = enemyP.front.slice();
        for (const u of targets) damageUnit(state, u, 1, '寒风');
        addLog(state, `寒风吹过，对 ${targets.length} 个敌方前线单位造成 1 点伤害。`, 'trigger');
        break;
      }
      case 'aerial_strike': {
        const t = target && findUnit(state, enemy, target.uid);
        if (t) {
          addLog(state, `空中闪击命中「${t.name}」，造成 4 点伤害。`, 'trigger');
          damageUnit(state, t, 4, '空中闪击');
        }
        break;
      }
      case 'death_descends': {
        const units = allUnits(state, enemy);
        if (units.length) {
          const victim = randomOf(state, units);
          addLog(state, `死亡降临：随机消灭了「${victim.name}」。`, 'trigger');
          destroyUnit(state, victim, '死亡降临');
        }
        break;
      }
      case 'dragon_knight': {
        for (const u of allUnits(state, side)) buffUnit(state, u, 2, 2, '龙骑士');
        addLog(state, '龙骑士的号角响起，所有友方单位获得 +2/+2。', 'buff');
        break;
      }
      case 'royal_salute': {
        const t = target && findUnit(state, enemy, target.uid);
        if (t) {
          addLog(state, `皇家礼炮轰击「${t.name}」，造成 5 点伤害。`, 'trigger');
          damageUnit(state, t, 5, '皇家礼炮');
        }
        break;
      }
      case 'blizzard': {
        const units = allUnits(state, enemy);
        for (const u of units) freezeUnit(state, u, '暴雪降临');
        addLog(state, `暴雪降临，冻结了 ${units.length} 个敌方单位。`, 'trigger');
        break;
      }
      case 'dragon_flute': {
        const t = target && findUnit(state, enemy, target.uid);
        if (t) {
          const stolenId = t.cardId;
          removeUnitFromBoard(state, t);
          addLog(state, '龙之笛的笛声将敌方龙族逐出战场。', 'trigger');
          if (state.random() < 0.1) {
            if (p.hand.length >= RULES.HAND_LIMIT) {
              addLog(state, `笛声引来「${Cards.get(stolenId).name}」，但你的手牌已满，它消散在风中。`, 'debuff');
            } else {
              p.hand.push(stolenId);
              emit(state, { t: 'draw', side, cardId: stolenId });
              addLog(state, `奇迹发生了：龙之笛将「${Cards.get(stolenId).name}」引向你的手牌！`, 'good');
            }
          }
        }
        break;
      }
      case 'head_start': {
        addLog(state, '捷足先登：前线的混血种撕开缺口，援军抢先抵达。', 'trigger');
        drawCard(state, side);
        if (state.winner == null) drawCard(state, side);
        break;
      }
      case 'quick_victory': {
        addLog(state, '快速取胜：敌方总部受到 5 点伤害，但敌方全体单位获得 +1/+1。', 'trigger');
        damageHQ(state, enemy, 5, '快速取胜');
        if (state.winner == null) {
          const units = allUnits(state, enemy);
          for (const u of units) buffUnit(state, u, 1, 1, '快速取胜');
          addLog(state, `快速取胜的代价：${units.length} 个敌方单位获得 +1/+1。`, 'debuff');
        }
        break;
      }
      case 'dragon_nest_repair': {
        healHQ(state, side, 8);
        let foundIndex = -1;
        for (let i = 0; i < p.deck.length; i++) {
          const c = Cards.get(p.deck[i]);
          if (c && c.type === 'unit' && c.tribe === 'dragon' && c.cost >= 3) { foundIndex = i; break; }
        }
        if (foundIndex >= 0) {
          const cardId = p.deck.splice(foundIndex, 1)[0];
          shuffleInPlace(p.deck, state.random);
          if (p.hand.length >= RULES.HAND_LIMIT) {
            addLog(state, `龙巢维修找到「${Cards.get(cardId).name}」，但手牌已满，卡牌被烧毁。`, 'debuff');
            emit(state, { t: 'overdraw', side, cardId });
          } else {
            p.hand.push(cardId);
            emit(state, { t: 'draw', side, cardId });
            addLog(state, `龙巢维修从卡组中找到了「${Cards.get(cardId).name}」。`, 'draw');
          }
        } else {
          addLog(state, '龙巢维修：卡组中没有费用≥3的龙族单位卡。', 'info');
        }
        break;
      }
      case 'last_stand': {
        const lost = Math.max(0, p.hp - 1);
        p.hp = 1;
        if (lost > 0) p.stats.damageTaken += lost;
        emit(state, { t: 'hqSet', side, hp: 1 });
        addLog(state, '最后一搏：你的总部生命被压到 1 点。', 'bad');
        for (const u of allUnits(state, side)) buffUnit(state, u, 4, 4, '最后一搏');
        addLog(state, '你的所有单位获得 +4/+4。', 'buff');
        break;
      }
      default:
        break;
    }
  }

  /* ============================ 公开动作 ============================ */

  function playCard(state, side, handIndex, target) {
    state.events = [];
    const check = canPlayCard(state, side, handIndex);
    if (!check.ok) return { ok: false, error: check.reason, events: state.events };
    const p = state.players[side];
    const card = check.card;
    if (!isValidTarget(state, side, card, target)) {
      const spec = card.target;
      if (spec && spec.required) return { ok: false, error: '需要选择一个合法目标', events: state.events };
      if (target) return { ok: false, error: '目标不合法', events: state.events };
    }

    p.crystals -= card.cost;
    p.hand.splice(handIndex, 1);
    p.stats.cardsPlayed += 1;

    if (card.type === 'unit') {
      const unit = makeUnit(state, card, side);
      p.support.push(unit);
      if (card.id === 'welsh_red') p.deployed.welsh = true;
      if (card.id === 'ice_dragon') p.deployed.ice = true;
      emit(state, { t: 'deploy', side, uid: unit.uid, cardId: card.id });
      addLog(state, `${p.name}部署了「${card.name}」。`, side === 0 ? 'play-self' : 'play-enemy');
      applyDeployEffect(state, side, unit, target, card);
      triggerElfDragonGrowth(state, unit, card);
    } else if (card.type === 'equip') {
      const unit = findUnit(state, side, target.uid);
      if (!unit) return { ok: false, error: '装备目标不存在', events: state.events };
      applyEquip(state, side, unit, card);
    } else {
      addLog(state, `${p.name}使用了「${card.name}」。`, side === 0 ? 'play-self' : 'play-enemy');
      emit(state, { t: 'tactic', side, cardId: card.id });
      resolveTactic(state, side, card, target);
    }

    processDeaths(state);
    checkWinner(state);
    return { ok: true, events: state.events };
  }

  function moveUnit(state, side, uid) {
    state.events = [];
    if (state.winner != null) return { ok: false, error: '对局已结束', events: state.events };
    const unit = findUnit(state, side, uid);
    if (!unit) return { ok: false, error: '单位不存在', events: state.events };
    if (!canMoveUnit(state, unit)) {
      let reason = '无法移动';
      if (unit.line !== 'support') reason = '该单位已经在前线';
      else if (unit.frozen) reason = '单位被冻结';
      else if (unit.exhausted) reason = '单位本回合已经行动';
      else reason = '前线已满';
      return { ok: false, error: reason, events: state.events };
    }
    const p = state.players[side];
    p.support.splice(p.support.indexOf(unit), 1);
    unit.line = 'front';
    unit.movedThisTurn = true;
    unit.actedThisTurn = true;
    unit.smoke = false;
    p.front.push(unit);
    emit(state, { t: 'move', side, uid, line: 'front' });
    addLog(state, `「${unit.name}」移动到前线。`, side === 0 ? 'play-self' : 'play-enemy');
    return { ok: true, events: state.events };
  }

  function isValidAttackTarget(state, attacker, target) {
    if (!target) return false;
    const list = getAttackTargets(state, attacker.side, attacker.uid);
    return list.some(t => t.kind === target.kind && t.uid === target.uid && t.side === target.side);
  }

  function getAttackTargets(state, side, uid) {
    const unit = findUnit(state, side, uid);
    if (!unit || !canAttackWith(state, unit)) return [];
    const enemy = otherSide(side);
    const enemyP = state.players[enemy];
    const out = [];
    if (unit.line === 'front') {
      for (const u of enemyP.front) {
        if (canBeAttacked(state, u)) out.push({ kind: 'unit', side: enemy, uid: u.uid, line: 'front' });
      }
      if (enemyP.front.length === 0) {
        for (const u of enemyP.support) {
          if (canBeAttacked(state, u)) out.push({ kind: 'unit', side: enemy, uid: u.uid, line: 'support' });
        }
      }
      // 对方前线有单位时，普通单位不能越过前线攻击总部
      if ((enemyP.front.length === 0 || unit.ignoreFrontlineHq) && unit.cardId !== 'nordic_white_dragon') {
        out.push({ kind: 'hq', side: enemy });
      }
    } else if (hasBow(unit)) {
      for (const u of enemyP.front) {
        if (canBeAttacked(state, u)) out.push({ kind: 'unit', side: enemy, uid: u.uid, line: 'front' });
      }
      for (const u of enemyP.support) {
        if (canBeAttacked(state, u)) out.push({ kind: 'unit', side: enemy, uid: u.uid, line: 'support' });
      }
    }
    return out;
  }

  function attack(state, side, uid, target) {
    state.events = [];
    if (state.winner != null) return { ok: false, error: '对局已结束', events: state.events };
    const unit = findUnit(state, side, uid);
    if (!unit) return { ok: false, error: '单位不存在', events: state.events };
    if (!canAttackWith(state, unit)) {
      let reason = '该单位无法攻击';
      if (unit.frozen) reason = '单位被冻结';
      else if (unit.exhausted) reason = '单位本回合已经行动';
      else if (unit.line === 'support') reason = '支援阵线的单位无法攻击（除非装备弓箭）';
      return { ok: false, error: reason, events: state.events };
    }
    if (!isValidAttackTarget(state, unit, target)) {
      return { ok: false, error: '目标不合法', events: state.events };
    }

    let dmg = unitAtk(state, unit);
    let robeProc = false;
    if (hasRobe(unit) && state.random() < 0.5) {
      dmg += 1;
      robeProc = true;
      addLog(state, '法袍的奥术涌动，额外造成 1 点伤害。', 'trigger');
    }

    unit.exhausted = true;
    unit.smoke = false;
    unit.movedThisTurn = true;
    unit.actedThisTurn = true;
    const enemy = otherSide(side);
    const targetUnit = target.kind === 'unit' ? findUnit(state, target.side != null ? target.side : enemy, target.uid) : null;
    emit(state, {
      t: 'attack', side, uid, targetKind: target.kind,
      targetUid: target.kind === 'unit' ? target.uid : null,
      targetSide: enemy, damage: dmg
    });

    if (target.kind === 'hq') {
      addLog(state, `「${unit.name}」攻击${state.players[enemy].name}总部，造成 ${dmg} 点伤害。`, side === 0 ? 'play-self' : 'play-enemy');
      damageHQ(state, enemy, dmg, unit.name);
    } else if (targetUnit) {
      const retaliation = unitAtk(state, targetUnit);
      const coveredByFront = unit.line === 'support' && hasBow(unit) && state.players[side].front.length > 0;
      addLog(state, `「${unit.name}」攻击「${targetUnit.name}」（${dmg} 点伤害）。`, side === 0 ? 'play-self' : 'play-enemy');
      damageUnit(state, targetUnit, dmg, unit.name);
      if (unit.cardId === 'fire_wyvern' && targetUnit.def > 0) {
        applyBurn(state, targetUnit, '火翼龙');
      }
      if (retaliation > 0) {
        if (coveredByFront) {
          emit(state, { t: 'cover', side, uid: unit.uid });
          addLog(state, `己方前线有单位掩护，「${unit.name}」未受到反击。`, 'info');
        } else {
          addLog(state, `「${targetUnit.name}」反击，对「${unit.name}」造成 ${retaliation} 点伤害。`, 'info');
          damageUnit(state, unit, retaliation, targetUnit.name);
        }
      }
    }

    processDeaths(state);
    checkWinner(state);
    return { ok: true, events: state.events };
  }

  function getActivatableUnits(state, side) {
    return allUnits(state, side).filter(u => u.cardId === 'azure_dragon' && !u.azureUsed);
  }

  function activateUnit(state, side, uid, target) {
    state.events = [];
    if (state.winner != null) return { ok: false, error: '对局已结束', events: state.events };
    if (state.active !== side) return { ok: false, error: '现在不是你的回合', events: state.events };
    const unit = findUnit(state, side, uid);
    if (!unit || unit.cardId !== 'azure_dragon') return { ok: false, error: '该单位没有可发动的能力', events: state.events };
    if (unit.azureUsed) return { ok: false, error: '本回合已经使用过', events: state.events };
    if (!target) return { ok: false, error: '需要选择友方目标', events: state.events };
    const t = findUnit(state, side, target.uid);
    if (!t) return { ok: false, error: '目标不合法', events: state.events };
    unit.azureUsed = true;
    const healed = healUnit(state, t, 1);
    emit(state, { t: 'activate', side, uid, targetUid: t.uid });
    if (healed > 0) addLog(state, `青龙为「${t.name}」恢复 ${healed} 点防御力。`, 'buff');
    else addLog(state, `青龙的疗愈落在「${t.name}」身上，但其防御力已满。`, 'info');
    return { ok: true, events: state.events };
  }

  function endTurn(state) {
    state.events = [];
    if (state.winner != null) return { ok: false, error: '对局已结束', events: state.events };
    const side = state.active;
    // 冻结持续到该单位控制者的回合结束
    for (const u of allUnits(state, side)) {
      if (u.frozen) {
        u.frozen = false;
        emit(state, { t: 'thaw', side: u.side, uid: u.uid });
        addLog(state, `「${u.name}」的冰霜消融。`, 'info');
      }
    }
    addLog(state, `${state.players[side].name}结束了回合。`, 'info');
    state.active = otherSide(side);
    beginTurn(state);
    return { ok: true, events: state.events };
  }

  function surrender(state, side) {
    state.events = [];
    if (state.winner != null) return { ok: true, events: state.events };
    state.winner = otherSide(side);
    state.winReason = `${state.players[side].name}投降`;
    emit(state, { t: 'gameover', winner: state.winner, reason: state.winReason });
    addLog(state, `${state.players[side].name}投降了。`, 'bad');
    return { ok: true, events: state.events };
  }

  /* ============================ 新局 ============================ */

  function makePlayer(side, deck, name) {
    return {
      side,
      name: name || SIDE_NAMES[side],
      hp: RULES.HQ_HP,
      maxHp: RULES.HQ_HP,
      deck: deck.slice(),
      hand: [],
      support: [],
      front: [],
      graveyard: [],
      crystals: 1,
      maxCrystals: 1,
      turnsTaken: 0,
      fatigue: 0,
      deployed: { welsh: false, ice: false },
      stats: { cardsPlayed: 0, unitsLost: 0, unitsKilled: 0, damageTaken: 0 }
    };
  }

  function createGame(opts) {
    opts = opts || {};
    const seed = (opts.seed == null ? ((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0) : opts.seed) >>> 0;
    const state = {
      seed,
      random: makeRng(seed || 1),
      turn: 0,
      active: 0,
      winner: null,
      winReason: null,
      events: [],
      log: [],
      logSeq: 0,
      uid: 1,
      players: [
        makePlayer(0, opts.playerDeck || [], opts.playerName || '你'),
        makePlayer(1, opts.enemyDeck || [], opts.enemyName || '对手')
      ]
    };

    shuffleInPlace(state.players[0].deck, state.random);
    shuffleInPlace(state.players[1].deck, state.random);

    addLog(state, '⚔ 战斗开始：双方总部各有 20 点生命，击破敌方总部即可获胜。', 'system');
    addLog(state, `你先手，对手使用「${opts.enemyDeckName || '未知卡组'}」。`, 'system');

    for (let i = 0; i < RULES.START_HAND; i++) {
      drawCard(state, 0, { silent: true });
      drawCard(state, 1, { silent: true });
    }

    beginTurn(state);
    state.events = [];
    return state;
  }

  /* ============================ 导出 ============================ */
  root.DBEngine = {
    RULES,
    createGame,
    playCard,
    moveUnit,
    attack,
    activateUnit,
    endTurn,
    surrender,
    canPlayCard,
    getCardOptions,
    getAttackTargets,
    getActivatableUnits,
    getTargets: validTargetList,
    canMoveUnit,
    canAttackWith,
    checkCondition,
    unitAtk,
    unitMaxDef,
    isUntargetable,
    isProtected,
    canBeAttacked,
    hasBow,
    hasRobe,
    findUnit,
    allUnits,
    otherSide
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

if (typeof module !== 'undefined' && module.exports) module.exports = globalThis.DBEngine;

  <script>
/* ==========================================================================
 * 龙裔王座 · Dragonblood Throne
 * ai.js — 电脑对手：启发式出牌与战斗决策（纯逻辑）
 * ========================================================================== */
(function (root) {
  'use strict';

  const Engine = root.DBEngine;
  const Cards = root.DBCards;
  if (!Engine || !Cards) throw new Error('ai.js 需要先加载 cards.js 与 engine.js');

  const AI_SIDE = 1;

  /* ============================ 估值 ============================ */

  function unitValue(state, u) {
    let v = Engine.unitAtk(state, u) * 2 + u.def + u.cost * 1.4 + u.equipment.length * 1.6;
    if (u.cardId === 'cave_dragon') v += 3 + u.def * 0.5;
    if (u.cardId === 'basilisk' && u.smoke) v += 2.5;
    if (u.cardId === 'demon_dragon') v += 2;
    if (u.cardId === 'welsh_red') v += 2;
    if (u.cardId === 'azure_dragon') v += 2;
    return v;
  }

  function threatOf(state, u) {
    let v = Engine.unitAtk(state, u) * 2 + u.def + u.cost * 1.2;
    if (u.cardId === 'cave_dragon') v += 3;

  function missingHp(state, u) { return Engine.unitMaxDef(u) - u.def; }

  /* ============================ 目标打法 ============================ */

  function targetValueForCard(state, card, unit) {

      case 'dragon_decree': return 2.0 + Engine.unitAtk(state, unit) * 0.6 + unit.def * 0.3;
      case 'aerial_strike': return (unit.def <= 4 ? threatOf(state, unit) + 4 : 4 + unit.def * 0.2);
      case 'dragon_flute': return threatOf(state, unit) * 0.9 + (unit.def >= 4 ? 2 : 0);

    for (const t of list) {
      const u = Engine.findUnit(state, t.side, t.uid);

  /* ============================ 出牌评分 ============================ */

    const enemyUnits = enemy.front.concat(enemy.support);
    const targetUnit = target ? Engine.findUnit(state, target.side, target.uid) : null;

    switch (card.id) {
      /* -------------------- 单位 -------------------- */
      case 'wyvern': return 3;
      case 'hybrid_spawn': return 3.2;
      case 'fire_wyvern': return 4;
      case 'great_dragon': return 4.5 + (enemy.front.length ? 1 : 0);
      case 'red_dragon': return 4;
      case 'green_dragon': return 3.8;
      case 'blue_dragon': return 4.8;
      case 'hybrid_mid': return 5;

      case 'hybrid_high': return 6.2;

/* ==========================================================================
 * 龙裔王座 · Dragonblood Throne
 * audio.js — WebAudio 程序化音效（无外部音频文件）

(function (root) {
  'use strict';

  let ctx = null;
  let master = null;
  let enabled = true;
  let last = {};

  function ensure() {
    if (typeof window === 'undefined') return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.32;
      master.connect(ctx.destination);

    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;

  function now() { return ctx ? ctx.currentTime : 0; }

  function tone(opts) {
    if (!enabled || !ensure()) return;
    const t0 = now() + (opts.delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(opts.freq || 440, t0);
    if (opts.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t0 + (opts.dur || 0.2));
    const vol = (opts.vol == null ? 0.2 : opts.vol);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (opts.dur || 0.2));
    osc.connect(gain); gain.connect(master);
    osc.start(t0); osc.stop(t0 + (opts.dur || 0.2) + 0.03);
  }

  let noiseBuffer = null;
  function getNoise() {
    if (!noiseBuffer) {
      const len = Math.floor(ctx.sampleRate * 1.2);
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    return noiseBuffer;
  }

  function noise(opts) {
    if (!enabled || !ensure()) return;
    const t0 = now() + (opts.delay || 0);
    const src = ctx.createBufferSource();
    src.buffer = getNoise();
    const filter = ctx.createBiquadFilter();
    filter.type = opts.filterType || 'bandpass';
    filter.frequency.setValueAtTime(opts.freq || 900, t0);
    if (opts.to) filter.frequency.exponentialRampToValueAtTime(Math.max(40, opts.to), t0 + (opts.dur || 0.2));
    filter.Q.value = opts.q || 1;
    const gain = ctx.createGain();
    const vol = (opts.vol == null ? 0.18 : opts.vol);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (opts.dur || 0.2));
    src.connect(filter); filter.connect(gain); gain.connect(master);
    src.start(t0); src.stop(t0 + (opts.dur || 0.2) + 0.05);
  }

    select() { tone({ freq: 440, to: 660, dur: 0.09, type: 'sine', vol: 0.12 }); },

    deploy() {
      tone({ freq: 150, to: 50, dur: 0.32, type: 'sine', vol: 0.34 });
      noise({ freq: 500, to: 120, dur: 0.28, vol: 0.12, filterType: 'lowpass' });
    },
    attack() {
      noise({ freq: 2400, to: 400, dur: 0.2, vol: 0.2, q: 0.8 });
      tone({ freq: 320, to: 90, dur: 0.14, type: 'sawtooth', vol: 0.1 });

    windup() {

    damage() {
      noise({ freq: 700, to: 180, dur: 0.12, vol: 0.14, filterType: 'lowpass' });
      tone({ freq: 140, to: 70, dur: 0.14, type: 'square', vol: 0.08 });
    },
    death() {
      tone({ freq: 240, to: 50, dur: 0.5, type: 'sawtooth', vol: 0.14 });
      noise({ freq: 900, to: 100, dur: 0.5, vol: 0.12, filterType: 'lowpass' });

    heal() {
      tone({ freq: 620, to: 940, dur: 0.24, type: 'sine', vol: 0.12 });
      tone({ freq: 930, to: 1240, dur: 0.22, type: 'sine', vol: 0.07, delay: 0.08 });

    buff() {
      tone({ freq: 520, to: 780, dur: 0.16, type: 'triangle', vol: 0.1 });
      tone({ freq: 780, to: 1040, dur: 0.18, type: 'triangle', vol: 0.08, delay: 0.09 });

      tone({ freq: 1500, to: 800, dur: 0.3, type: 'sine', vol: 0.1 });
